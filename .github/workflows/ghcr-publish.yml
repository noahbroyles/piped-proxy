name: Publish to GHCR

# Publishes a multi-architecture image to ghcr.io/<owner>/<repo>, using only the built in GITHUB_TOKEN (no secrets to configure).
on:
    push:
        paths-ignore:
            - "**.md"
        branches:
            - main
    # Allows publishing by hand from the Actions tab.
    workflow_dispatch:

# A newer run replaces an older one, so that the latest tag cannot end up pointing at an older build.
concurrency:
    group: ghcr-publish-${{ github.ref }}
    cancel-in-progress: true

# The default token is read only, so the jobs below ask for packages: write on their own.
permissions:
    contents: read

jobs:
    # Each architecture builds on a native runner: compiling Rust with LTO under QEMU would take hours.
    build:
        strategy:
            fail-fast: true
            matrix:
                include:
                    - platform: linux/amd64
                      runner: ubuntu-24.04
                    - platform: linux/arm64
                      runner: ubuntu-24.04-arm
        runs-on: ${{ matrix.runner }}
        permissions:
            contents: read
            packages: write
        steps:
            - uses: actions/checkout@v6
            # GHCR rejects uppercase letters in image names.
            - name: Compute names
              id: names
              run: |
                  echo "image=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
                  platform="${{ matrix.platform }}"
                  echo "pair=${platform//\//-}" >> "$GITHUB_OUTPUT"
            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v4
            - name: Login to GHCR
              uses: docker/login-action@v4
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}
            # Pushes the image by digest only; the merge job below gives the digests their tags.
            - name: Build and push by digest
              id: build
              uses: docker/build-push-action@v7
              with:
                  context: .
                  platforms: ${{ matrix.platform }}
                  outputs: type=image,name=${{ steps.names.outputs.image }},push-by-digest=true,name-canonical=true,push=true
                  cache-from: type=gha,scope=${{ steps.names.outputs.pair }}
                  cache-to: type=gha,mode=max,scope=${{ steps.names.outputs.pair }}
            - name: Export digest
              run: |
                  mkdir -p "${{ runner.temp }}/digests"
                  digest="${{ steps.build.outputs.digest }}"
                  touch "${{ runner.temp }}/digests/${digest#sha256:}"
            - uses: actions/upload-artifact@v7
              with:
                  name: digests-${{ steps.names.outputs.pair }}
                  path: ${{ runner.temp }}/digests/*
                  if-no-files-found: error
                  retention-days: 1

    # Joins the per-architecture images into one multi-architecture tag.
    merge:
        needs: build
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write
        steps:
            - uses: actions/download-artifact@v7
              with:
                  path: ${{ runner.temp }}/digests
                  pattern: digests-*
                  merge-multiple: true
            - name: Compute image name
              id: image
              run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
            - name: Set up Docker Buildx
              uses: docker/setup-buildx-action@v4
            - name: Login to GHCR
              uses: docker/login-action@v4
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}
            # Tags the image with latest (default branch only) and with the commit, such as sha-1a2b3c4.
            - name: Extract metadata
              id: meta
              uses: docker/metadata-action@v6
              with:
                  images: ${{ steps.image.outputs.name }}
                  tags: |
                      type=raw,value=latest,enable={{is_default_branch}}
                      type=sha
            - name: Create manifest list and push
              working-directory: ${{ runner.temp }}/digests
              run: |
                  docker buildx imagetools create \
                      $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
                      $(printf '${{ steps.image.outputs.name }}@sha256:%s ' *)
